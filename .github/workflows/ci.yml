name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test (100% coverage enforced by vitest thresholds)
        run: npm test -- --coverage

      - name: Build
        run: npm run build

  load:
    name: HTTP transport load budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Budgets are several times looser than the README numbers (16-thread laptop) because
      # hosted runners have 4 vCPUs; they catch order-of-magnitude regressions, not noise.
      # Hosted runs measured p99 2010 ms for the single-call path and 2479 ms for batch at
      # concurrency 200 (runs 37293764967, 37293397377), both with 0 errors, so 2000 ms sat on the
      # noise floor; 4000 ms still fails a 2x regression against the laptop numbers.
      - name: Load test
        run: npm run load-test -- --requests 2000 --max-p99-ms 4000 --min-rps 100

      - name: Load test (one session)
        run: npm run load-test -- --session --requests 2000 --max-p99-ms 4000 --min-rps 100

      - name: Load test (batch)
        run: npm run load-test -- --batch --requests 2000 --max-p99-ms 4000 --min-rps 100

      - name: Load test (build_diagram)
        run: npm run load-test -- --build --requests 2000 --max-p99-ms 4000 --min-rps 100

      - name: Load test (lint_diagram, one session)
        run: npm run load-test -- --lint --session --requests 2000 --max-p99-ms 4000 --min-rps 100

      - name: Load test (build_model and apply_pattern dry runs, one session)
        run: |
          npm run load-test -- --model --session --requests 2000 --max-p99-ms 4000 --min-rps 100
          npm run load-test -- --pattern --session --requests 2000 --max-p99-ms 4000 --min-rps 100

      - name: Load test (diagram_quality and an improve_diagram dry run, one session)
        run: |
          npm run load-test -- --quality --session --requests 2000 --max-p99-ms 4000 --min-rps 100
          npm run load-test -- --improve --session --requests 2000 --max-p99-ms 4000 --min-rps 100

      - name: Load test (derive_diagrams dry run under the oo tier, one session)
        run: npm run load-test -- --derive --session --requests 2000 --max-p99-ms 4000 --min-rps 100

      - name: Load test (quick_find, one session)
        run: npm run load-test -- --quick-find --session --requests 2000 --max-p99-ms 4000 --min-rps 100
