name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test (100% coverage enforced by vitest thresholds)
        run: npm test -- --coverage

      - name: Build
        run: npm run build

  load:
    name: HTTP transport load budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Budgets are several times looser than the README numbers (16-thread laptop) because
      # hosted runners have 4 vCPUs; they catch order-of-magnitude regressions, not noise.
      - name: Load test
        run: npm run load-test -- --requests 2000 --max-p99-ms 2000 --min-rps 100

      # batch and build_diagram carry 4-op bodies through schema validation per request; at
      # concurrency 200 the first hosted run measured p99 2479 ms (run 37293397377) with 0 errors,
      # so their budget is doubled relative to the single-call path.
      - name: Load test (batch)
        run: npm run load-test -- --batch --requests 2000 --max-p99-ms 4000 --min-rps 100

      - name: Load test (build_diagram)
        run: npm run load-test -- --build --requests 2000 --max-p99-ms 4000 --min-rps 100
